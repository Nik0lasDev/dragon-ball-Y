<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101d30">
<meta name="description" content="Dragon Ball: Ki Rising — jogo de luta pixel art em desenvolvimento.">
<title>Dragon Ball: Ki Rising</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">
  <header>
    <div>
      <h1>DRAGON BALL <span>· KI RISING</span></h1>
      <div class="sub">Pixel fighter · Build 0.2</div>
    </div>
    <nav class="top-actions" aria-label="Modos de jogo">
      <button id="arenaBtn" class="active" type="button">Combate</button>
      <button id="trainBtn" type="button">Treinamento</button>
    </nav>
  </header>
  <section class="game-frame" aria-label="Área do jogo">
    <canvas id="game" width="640" height="360" aria-label="Jogo de luta em pixel art"></canvas>
    <div class="hud">
      <div class="status">
        <div class="statline"><span>VIDA</span><span id="hpText">100 / 100</span></div>
        <div class="bar"><div id="hpBar" class="fill hp"></div></div>
        <div class="statline"><span>KI</span><span id="kiText">100 / 100</span></div>
        <div class="bar"><div id="kiBar" class="fill ki"></div></div>
      </div>
      <div class="center-info" id="modeLabel">CAMPO DE BATALHA</div>
      <div class="status">
        <div class="statline"><span>NÍVEL <b id="level">1</b></span><span>EXP <b id="xpText">0</b></span></div>
        <div class="bar"><div id="xpBar" class="fill xp" style="width:0%"></div></div>
        <div class="statline"><span>INIMIGOS</span><span id="enemyCount">1</span></div>
        <div class="statline"><span>FORÇA</span><span id="powerText">10</span></div>
      </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </section>
  <footer class="bottom">
    <div class="keys">
      <span><b class="key">A / D</b> mover</span>
      <span><b class="key">W</b> pular</span>
      <span><b class="key">J</b> carregar / lançar Ki</span>
      <span><b class="key">K</b> atacar</span>
      <span><b class="key">Shift</b> correr</span>
    </div>
    <span class="hint">Segure J para concentrar energia. Solte para disparar.</span>
  </footer>
</main>
<script src="game.js" defer></script>
</body>
</html>
